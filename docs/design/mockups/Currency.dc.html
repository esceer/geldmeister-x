<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Glass — Currency switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0D17; font-family: Inter, system-ui, sans-serif; color: #F4F5FA">
  <div aria-hidden="true" style="position: absolute; width: 280px; height: 280px; left: -80px; top: -40px; border-radius: 50%; background: #5B4BFF; filter: blur(90px); opacity: 0.55"></div>
  <div aria-hidden="true" style="position: absolute; width: 240px; height: 240px; right: -90px; top: 300px; border-radius: 50%; background: #0FB5A0; filter: blur(90px); opacity: 0.45"></div>
  <div aria-hidden="true" style="position: absolute; width: 220px; height: 220px; left: 40px; bottom: -60px; border-radius: 50%; background: #E0458B; filter: blur(100px); opacity: 0.4"></div>

  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 52px; display: flex; flex-direction: column; gap: 16px; opacity: 0.5">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: rgba(235,237,250,0.64)">October 2026</span><span style="font-size: 28px; font-weight: 700">Overview</span></div>
    <div style="height: 150px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px"></div>
    <div style="height: 150px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,6,12,0.5)"></div>

  <section aria-label="Choose currency" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 32px; display: flex; flex-direction: column; gap: 16px; border-radius: 32px 32px 0 0; background: rgba(28,30,48,0.62); border-top: 1px solid rgba(255,255,255,0.16); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%)">
    <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3)"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 20px; font-weight: 700">Currency</h1>
      <a href="Main.dc.html" style="padding: 8px 0; font-size: 15px; font-weight: 600; color: #AEB8FF">Done</a>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: rgba(235,237,250,0.64)">Each currency keeps its own expenses, budgets, recurring items and reports. Amounts are never converted.</p>

    <div style="padding: 0 16px; display: flex; flex-direction: column; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px">
      <a href="Main.dc.html" aria-current="true" style="display: flex; align-items: center; gap: 12px; height: 68px; border-bottom: 1px solid rgba(255,255,255,0.08)">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(142,155,255,0.2); color: #C9D0FF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">HUF</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Hungarian forint</span><span style="font-size: 12px; color: rgba(235,237,250,0.64)">284 650 Ft in October</span></span>
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #8E9BFF; color: #0B0D17; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
      </a>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 68px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">EUR</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Euro</span><span style="font-size: 12px; color: rgba(235,237,250,0.64)">312,40 € in October</span></span>
        <span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid rgba(255,255,255,0.25)"></span>
      </a>
    </div>

    <button type="button" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 26px; background: none; border: 1px dashed rgba(255,255,255,0.3); color: #F4F5FA; font: 600 15px Inter, sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add currency</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
